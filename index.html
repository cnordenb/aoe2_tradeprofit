<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AoE2 Trade Calculator</title>
<style>
  :root {
    color-scheme: dark;
  }
  body {
    font-family: system-ui, sans-serif;
    max-width: 360px;
    margin: 0 auto;
    padding: 0 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: #121212;
    color: #e0e0e0;
  }
  input, select, button {
    font-size: 1.2rem;
    padding: 8px;
    box-sizing: border-box;
    background: #1e1e1e;
    color: #e0e0e0;
    border: 1px solid #444;
    border-radius: 4px;
  }
  input, select {
    width: 100%;
  }
  select {
    margin-bottom: 16px;
  }
  /* Hide the number input's increment/decrement arrows. */
  input[type="number"] {
    -moz-appearance: textfield;
    appearance: textfield;
  }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .row {
    position: relative;
  }
  /* Buttons sit outside the content column, out in the right margin. */
  .buttons {
    position: absolute;
    left: 100%;
    top: 50%;
    transform: translateY(-50%);
    margin-left: 24px;
    width: max-content;
    max-width: 240px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  /* On narrow screens there's no margin to use, so put them beside the input. */
  @media (max-width: 960px) {
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .row > input {
      flex: 1;
      min-width: 0;
    }
    .buttons {
      position: static;
      transform: none;
      margin-left: 0;
      max-width: 50%;
    }
  }
  button {
    font-size: 0.9rem;
    padding: 4px 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover {
    background: #2a2a2a;
  }
  #result {
    margin-top: 20px;
  }
  /* Keep the result's space reserved while hidden so the centred
     content doesn't jump when it appears. */
  #result[hidden] {
    display: block;
    visibility: hidden;
  }
  .result-row {
    display: flex;
    gap: 24px;
    white-space: nowrap;
  }
  /* No margin to spill into on narrow screens, so let the pair wrap. */
  @media (max-width: 720px) {
    .result-row {
      flex-wrap: wrap;
    }
  }
  .value {
    font-size: 2rem;
  }
  .unit {
    font-size: 1rem;
    color: #999;
  }
  .radios {
    display: flex;
    gap: 12px;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  /* .option sets its own display, which overrides the browser's
     display: none for [hidden], so a hidden Cog-only option keeps its space
     reserved and the other options don't move when it disappears. */
  .cog-only[hidden] {
    visibility: hidden;
  }
  /* Extra space to separate a new group of options. */
  .group-start {
    margin-top: 12px;
  }
  input[type="checkbox"], input[type="radio"] {
    width: auto;
    margin: 0;
    cursor: pointer;
  }
  input[type="range"] {
    margin-top: 12px;
    padding: 0;
    border: none;
    background: transparent;
  }
  .bump-label {
    margin-top: 16px;
  }
  #bump {
    margin-top: 4px;
    accent-color: #e53935;
  }
  #error {
    color: #ff6b6b;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <label for="size">Map size:</label>
  <select id="size">
    <option value="120" selected>Tiny (2 player) [120]</option>
    <option value="144">Small (3 player) [144]</option>
    <option value="168">Medium (4 player) [168]</option>
    <option value="200">Normal (6 player) [200]</option>
    <option value="220">Large (8 player) [220]</option>
    <option value="240">Huge [240]</option>
    <option value="480">Ludicrous [480]</option>
  </select>

  <label for="num">Distance in tiles:</label>
  <div class="row">
    <input id="num" type="number" min="0" step="1" value="40" autofocus>
    <div class="buttons">
      <div class="radios" role="radiogroup" aria-label="Trade unit">
        <label class="option"><input type="radio" name="unit" value="cart" checked> Cart</label>
        <label class="option"><input id="cog" type="radio" name="unit" value="cog"> Cog</label>
      </div>
      <button type="button" id="sideToSide">Side to side</button>
      <button type="button" id="cornerToCorner">Corner to corner</button>
      <label class="option"><input id="caravan" type="checkbox"> Caravan</label>
      <label class="option cog-only"><input id="clinker" type="checkbox"> Clinker Construction</label>
      <label class="option cog-only"><input id="carvel" type="checkbox"> Carvel Hull</label>
      <label class="option"><input id="halfTrip" type="checkbox"> Half-trip start</label>
      <label class="option group-start"><input id="spanish" type="checkbox"> Spanish team bonus</label>
      <label class="option"><input id="silkRoad" type="checkbox"> Silk Road (Italian UT: trade units cost -50%)</label>
      <label class="option"><input id="grandTrunk" type="checkbox"> Grand Trunk Road (Hindustani UT: 10% more gold per trip)</label>
      <label class="option"><input id="varangian" type="checkbox"> Varangian civ bonus (+50% stronger Caravan)</label>
    </div>
  </div>
  <input id="slider" type="range" min="0" max="169" step="1" value="40" aria-label="Distance in tiles">
  <div id="error"></div>
  <div id="result" hidden>
    <div class="result-row">
      <div><span id="perTrip" class="value"></span> <span class="unit">gold per trip</span></div>
      <div><span id="tripTime" class="value"></span> <span class="unit">time per round-trip</span></div>
    </div>
    <div><span id="perMinute" class="value"></span> <span class="unit">gold per minute</span></div>
    <div><span id="breakEven" class="value"></span> <span class="unit">break-even time</span></div>
  </div>
  <label for="bump" class="bump-label">Bump factor: <span id="bumpValue">0</span>%</label>
  <input id="bump" type="range" min="0" max="25" step="1" value="0">

<script>
  const input = document.getElementById("num");
  const slider = document.getElementById("slider");
  const size = document.getElementById("size");
  const caravan = document.getElementById("caravan");
  const clinker = document.getElementById("clinker");
  const carvel = document.getElementById("carvel");
  const halfTrip = document.getElementById("halfTrip");
  const spanish = document.getElementById("spanish");
  const varangian = document.getElementById("varangian");
  const silkRoad = document.getElementById("silkRoad");
  const grandTrunk = document.getElementById("grandTrunk");
  const cog = document.getElementById("cog");
  const bump =document.getElementById("bump");
  const bumpValue = document.getElementById("bumpValue");
  const result = document.getElementById("result");
  const perTrip = document.getElementById("perTrip");
  const tripTime = document.getElementById("tripTime");
  const perMinute = document.getElementById("perMinute");
  const breakEven = document.getElementById("breakEven");
  const error = document.getElementById("error");

  function calculate() {
    const text = input.value.trim();
    result.hidden = true;
    error.textContent = "";

    if (text === "") return;

    const x = Number(text);
    if (!Number.isInteger(x)) {
      error.textContent = "Please enter a whole number.";
      return;
    }

    const d = Number(size.value);

    // Spanish team bonus multiplies gold per trip by 1.25, kept whole as
    // q / 4 quarters (q = 5 with the bonus, 4 without).
    const q = spanish.checked ? 5 : 4;

    // Grand Trunk Road multiplies gold per trip by 1.1, kept whole as
    // g / 10 tenths (g = 11 with the tech, 10 without).
    const g = grandTrunk.checked ? 11 : 10;

    // 0.46 * x * (x / d + 0.3) is exactly 23 * x * (10x + 3d) / (500d),
    // times q / 4 and g / 10 for the bonuses. Rounded to one decimal, done as
    // 23 * x * (10x + 3d) * q * g / (2000d) so whole-number math avoids
    // floating-point rounding errors. Negative results are clamped to 0.
    const trip = Math.max(0, Math.round((23 * x * (10 * x + 3 * d) * q * g) / (2000 * d)) / 10);

    // Speed in thousandths of a tile per second, kept whole so speeds like
    // 1.65 don't bring in floating-point rounding errors.
    const s = speedThousandths();

    // Bump factor b reduces gold per minute by b percent (0 - 25).
    const b = Number(bump.value);

    // Time per trip: there and back (2x tiles) at speed s / 1000, stretched
    // by the bump factor the same way gold per minute is reduced.
    const tripSeconds = Math.round((2 * x * 100000) / (s * (100 - b)));

    // A trip is there and back (2x tiles), so it takes 2x / speed seconds
    // and gold per minute = trip * 60 * speed / (2x). Using the unrounded
    // trip value the x cancels out, leaving 69 * (10x + 3d) * speed / (50d),
    // then the bump factor scales it by (100 - b) / 100, the Spanish
    // bonus by q / 4 and Grand Trunk Road by g / 10. Rounded to one decimal
    // with speed = s / 1000, done as
    // 69 * (10x + 3d) * s * (100 - b) * q * g / (20000000d).
    const minute = x === 0 ? 0 : Math.round((69 * (10 * x + 3 * d) * s * (100 - b) * q * g) / (20000000 * d)) / 10;

    // Trade unit gold cost: 50, halved to 25 by Silk Road.
    const cost = silkRoad.checked ? 25 : 50;

    // Break-even: full trips needed to earn the gold cost, using the
    // unrounded trip value, so ceil(cost / trip)
    // = ceil(cost * 20000d / (23x(10x + 3d) * q * g)).
    // Each trip covers 2x tiles, except a half-trip start where the first
    // trip covers only x. Time is tiles / speed, stretched by the bump
    // factor the same way gold per minute is reduced. Shown as m:ss.
    let breakEvenText = "never";
    if (x > 0) {
      const trips = Math.ceil((cost * 20000 * d) / (23 * x * (10 * x + 3 * d) * q * g));
      const tiles = trips * 2 * x - (halfTrip.checked ? x : 0);
      const seconds = Math.round((tiles * 100000) / (s * (100 - b)));
      breakEvenText = formatTime(seconds);
    }

    perTrip.textContent = trip.toFixed(1);
    tripTime.textContent = formatTime(tripSeconds);
    perMinute.textContent = minute.toFixed(1);
    breakEven.textContent = breakEvenText;
    result.hidden = false;
  }

  // Whole seconds as m:ss.
  function formatTime(seconds) {
    return Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0");
  }

  // Trade unit speed in thousandths of a tile per second. Base speed is
  // Cart 1.25, Cog 1.65. Caravan adds 20%, or 30% with the Varangian bonus
  // making its boost 50% bigger (kept whole as tenths: 10, 12 or 13).
  // Clinker Construction and Carvel Hull each make a Cog 10% faster (kept
  // whole as hundredths: 100, 110 or 121), and the Cog's speed is rounded up
  // to two decimals, e.g. 1.65 * 1.2 * 1.1 * 1.1 = 2.3958 becomes 2.40.
  function speedThousandths() {
    let caravanBoost = 10;
    if (caravan.checked) caravanBoost = varangian.checked ? 13 : 12;
    if (!cog.checked) return (1250 * caravanBoost) / 10;
    let hull = 100;
    if (clinker.checked) hull = (hull * 11) / 10;
    if (carvel.checked) hull = (hull * 11) / 10;
    // 165 * caravanBoost * hull is in hundred-thousandths; / 1000 and
    // rounded up gives hundredths, * 10 gives thousandths.
    return Math.ceil((165 * caravanBoost * hull) / 1000) * 10;
  }

  // Clinker Construction and Carvel Hull only apply to a Cog.
  function updateCogOptions() {
    document.querySelectorAll(".cog-only").forEach((option) => {
      option.hidden = !cog.checked;
    });
  }

  // Side to side and corner to corner subtract 8 for a cart, 6 for a cog.
  function edgeOffset() {
    return cog.checked ? 6 : 8;
  }

  // Maximum value is size * 1.41, done as * 141 / 100 and rounded.
  function maxDistance() {
    return Math.round((Number(size.value) * 141) / 100);
  }

  function updateMax() {
    slider.max = maxDistance();
    input.max = maxDistance();
  }

  // Values typed outside 0 - maximum are replaced with the nearest limit.
  function clampInput() {
    if (input.value === "") return;
    if (Number(input.value) > maxDistance()) input.value = maxDistance();
    else if (Number(input.value) < 0) input.value = 0;
  }

  // Move the slider to match the text field.
  function syncSlider() {
    if (input.value !== "") slider.value = input.value;
  }

  function setDistance(value) {
    input.value = value;
    syncSlider();
    calculate();
  }

  document.getElementById("sideToSide").addEventListener("click", () => {
    setDistance(Number(size.value) - edgeOffset());
  });

  // (size - offset) * 1.41, done as * 141 / 100 and rounded to a whole number
  // since the calculation only accepts integers.
  document.getElementById("cornerToCorner").addEventListener("click", () => {
    setDistance(Math.round(((Number(size.value) - edgeOffset()) * 141) / 100));
  });

  slider.addEventListener("input", () => {
    input.value = slider.value;
    calculate();
  });

  input.addEventListener("input", () => {
    clampInput();
    syncSlider();
    calculate();
  });

  size.addEventListener("change", () => {
    updateMax();
    clampInput();
    syncSlider();
    calculate();
  });

  caravan.addEventListener("change", calculate);
  halfTrip.addEventListener("change", calculate);
  spanish.addEventListener("change", calculate);
  varangian.addEventListener("change", calculate);
  silkRoad.addEventListener("change", calculate);
  grandTrunk.addEventListener("change", calculate);

  // Clinker Construction is a prerequisite of Carvel Hull: ticking Carvel Hull
  // ticks Clinker Construction, and unticking Clinker Construction unticks
  // Carvel Hull.
  clinker.addEventListener("change", () => {
    if (!clinker.checked) carvel.checked = false;
    calculate();
  });
  carvel.addEventListener("change", () => {
    if (carvel.checked) clinker.checked = true;
    calculate();
  });

  document.querySelectorAll('input[name="unit"]').forEach((radio) => {
    radio.addEventListener("change", () => {
      updateCogOptions();
      calculate();
    });
  });

  bump.addEventListener("input", () => {
    bumpValue.textContent = bump.value;
    calculate();
  });

  updateMax();
  // Browsers can restore the unit choice on reload, so match the Cog options to it.
  updateCogOptions();
  // Browsers can restore the slider position on reload, so show its real value.
  bumpValue.textContent = bump.value;
  // Always start at a distance of 40 so the results are shown on load.
  setDistance(40);
</script>
</body>
</html>
